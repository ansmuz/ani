<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aniwo - Anime Search</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        nav {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 15px 0;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .input-container {
            position: relative;
            width: 300px;
        }

        #input {
            width: 100%;
            padding: 12px 10px;
            font-size: 16px;
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 5px;
            outline: none;
            transition: all 0.3s;
        }

        #input:focus {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 0 2px #4cc9f0;
        }

        .label {
            position: absolute;
            top: 12px;
            left: 10px;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.7);
            pointer-events: none;
            transition: 0.3s;
        }

        #input:focus ~ .label,
        #input:valid ~ .label {
            top: -20px;
            left: 0;
            font-size: 14px;
            color: #4cc9f0;
        }

        .underline {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: #4cc9f0;
            transition: 0.3s;
        }

        #input:focus ~ .underline {
            width: 100%;
        }

        .navbar h2 {
            color: #4cc9f0;
            font-size: 28px;
            text-shadow: 0 0 10px rgba(76, 201, 240, 0.5);
        }

        #anime-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .anime-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .anime-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .anime-img {
            width: 100%;
            height: 350px;
            overflow: hidden;
        }

        .anime-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .anime-card:hover .anime-img img {
            transform: scale(1.05);
        }

        .anime-detail-box {
            padding: 20px;
        }

        .anime-name {
            font-size: 20px;
            margin-bottom: 10px;
            color: #4cc9f0;
            line-height: 1.3;
        }

        .score-badge {
            display: inline-block;
            background: rgba(76, 201, 240, 0.2);
            color: #4cc9f0;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .genres {
            margin-bottom: 10px;
        }

        .genres span {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 12px;
            margin-right: 5px;
            margin-bottom: 5px;
        }

        .year {
            margin-bottom: 10px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }

        .synopsis {
            font-size: 14px;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.8);
        }

        .search-results-info {
            text-align: center;
            margin-bottom: 20px;
            color: #4cc9f0;
            font-size: 18px;
        }

        .loading {
            text-align: center;
            font-size: 18px;
            color: #4cc9f0;
            margin: 40px 0;
        }

        .error {
            text-align: center;
            color: #f472b6;
            margin: 40px 0;
            font-size: 18px;
        }

        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
            }
            
            .input-container {
                width: 100%;
            }
            
            #anime-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="navbar">
            <div class="input-container">
                <input type="text" id="input" required>
                <label for="input" class="label">Search Anime</label>
                <div class="underline"></div>
            </div>
            <h2>Aniwo</h2>
        </div>
    </nav>
    
    <div id="search-results-info" class="search-results-info"></div>
    
    <div id="anime-container">
        <div class="loading">Loading anime...</div>
    </div>

    <script>
        const container = document.getElementById("anime-container");
        const searchInput = document.getElementById("input");
        const searchResultsInfo = document.getElementById("search-results-info");
        
        let searchTimeout;
        let isSearching = false;

        // 🔹 Fetch random anime page
        async function fetchAnime() {
            try {
                container.innerHTML = '<div class="loading">Loading anime...</div>';
                
                let randomPage = Math.floor(Math.random() * 30) + 1; // 1 - 30
                const res = await fetch(`https://api.jikan.moe/v4/top/anime?page=${randomPage}`);
                const data = await res.json();

                displayAnime(data.data.slice(0, 5)); // sirf 5 anime dikhao
                searchResultsInfo.textContent = "Top Rated Anime";
            } catch (err) {
                console.error("Error:", err);
                container.innerHTML = '<div class="error">Failed to load anime. Please try again later.</div>';
            }
        }

        // 🔹 Search anime function
        async function searchAnime(query) {
            if (!query.trim()) {
                fetchAnime();
                return;
            }
            
            try {
                isSearching = true;
                container.innerHTML = '<div class="loading">Searching anime...</div>';
                
                const res = await fetch(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(query)}&limit=5`);
                const data = await res.json();
                
                if (data.data && data.data.length > 0) {
                    displayAnime(data.data);
                    searchResultsInfo.textContent = `Search Results for "${query}"`;
                } else {
                    container.innerHTML = '<div class="error">No anime found with that name. Try a different search.</div>';
                    searchResultsInfo.textContent = `No results for "${query}"`;
                }
            } catch (err) {
                console.error("Search Error:", err);
                container.innerHTML = '<div class="error">Search failed. Please try again.</div>';
            } finally {
                isSearching = false;
            }
        }

        // 🔹 Display anime function
        function displayAnime(animeList) {
            container.innerHTML = ""; // clear old

            animeList.forEach(anime => {
                const card = document.createElement("div");
                card.classList.add("anime-card");

                card.innerHTML = `
                    <div class="anime-img">
                        <img src="${anime.images.jpg.image_url}" alt="${anime.title}" onerror="this.src='https://via.placeholder.com/300x400/1a1a2e/ffffff?text=No+Image'">
                    </div>
                `;

                const detail = document.createElement("div");
                detail.classList.add("anime-detail-box");

                // Genres list
                const genres = anime.genres.map(g => `<span>${g.name}</span>`).join(" ");

                detail.innerHTML = `
                    <h3 class="anime-name">${anime.title}</h3>
                    <div class="score-badge">⭐ ${anime.score ?? "N/A"}</div>
                    <div class="genres">${genres}</div>
                    <p class="year"><strong>Year:</strong> ${anime.year ?? "?"}</p>
                    <p class="synopsis">${anime.synopsis ? anime.synopsis.slice(0, 200) + "..." : "No synopsis available."}</p>
                `;

                card.appendChild(detail);
                container.appendChild(card);
            });
        }

        // 🔹 Event listener for search input
        searchInput.addEventListener("input", function() {
            clearTimeout(searchTimeout);
            const query = this.value.trim();
            
            if (query.length === 0) {
                fetchAnime();
                return;
            }
            
            // Add delay to avoid too many API calls
            searchTimeout = setTimeout(() => {
                searchAnime(query);
            }, 500);
        });

        // 🔹 Load anime on page start
        fetchAnime();
    </script>
</body>
</html>
